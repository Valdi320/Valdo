name: W-IND-105 reader-inclusive NFC energy gate (digital only)

on:
  push:
    paths:
      - "research/2026-10-28-independent-wpt-sensor-v01/w_ind_105/**"
      - "research/2026-10-28-independent-wpt-sensor-v01/w_ind_102/AN4913_REV2_EH.csv"
      - ".github/workflows/w-ind-105-reader-energy-gate.yml"
  pull_request:
    paths:
      - "research/2026-10-28-independent-wpt-sensor-v01/w_ind_105/**"
      - "research/2026-10-28-independent-wpt-sensor-v01/w_ind_102/AN4913_REV2_EH.csv"
      - ".github/workflows/w-ind-105-reader-energy-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research/2026-10-28-independent-wpt-sensor-v01
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run adversarial tests and generate deterministic evidence
        run: |
          python -m unittest -v w_ind_105.test_w_ind_105
          python -m w_ind_105.w_ind_105 --out w_ind_105/RESULTADO_CI.json
      - name: Upload reproducible JSON evidence
        uses: actions/upload-artifact@v4
        with:
          name: w-ind-105-reader-inclusive-nfc-energy-gate
          path: research/2026-10-28-independent-wpt-sensor-v01/w_ind_105/RESULTADO_CI.json
          if-no-files-found: error
