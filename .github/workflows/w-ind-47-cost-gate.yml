name: W47-cost-idle-energy-screen-NOT-HARDWARE
on:
  push:
    branches: [w/independent-sensor-wpt-link-20261028]
    paths:
      - 'research/2026-10-28-independent-wpt-sensor-v01/w_ind_47/**'
      - '.github/workflows/w-ind-47-cost-gate.yml'
  pull_request:
    paths:
      - 'research/2026-10-28-independent-wpt-sensor-v01/w_ind_47/**'
      - '.github/workflows/w-ind-47-cost-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests and deterministic evidence (NOT physical qualification)
        run: |
          set -euo pipefail
          cd research/2026-10-28-independent-wpt-sensor-v01/w_ind_47
          python3 -m unittest -v test_w47
          python3 w47_cost_gate.py --out W47_SYNTHETIC_NOT_HARDWARE.json
          python3 -m json.tool W47_SYNTHETIC_NOT_HARDWARE.json > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: W47-COST-IDLE-SYNTHETIC-CATALOG-NOT-HARDWARE
          path: research/2026-10-28-independent-wpt-sensor-v01/w_ind_47/W47_SYNTHETIC_NOT_HARDWARE.json
