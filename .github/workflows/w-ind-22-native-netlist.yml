name: W-IND-22 native KiCad netlist topology gate (NO hardware approval)
on:
  push:
    branches: [w/independent-sensor-wpt-link-20261028]
    paths:
      - 'research/2026-10-28-independent-wpt-sensor-v01/w_ind_21/**'
      - 'research/2026-10-28-independent-wpt-sensor-v01/w_ind_22/**'
      - '.github/workflows/w-ind-22-native-netlist.yml'
  pull_request:
    paths:
      - 'research/2026-10-28-independent-wpt-sensor-v01/w_ind_21/**'
      - 'research/2026-10-28-independent-wpt-sensor-v01/w_ind_22/**'
      - '.github/workflows/w-ind-22-native-netlist.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-netlist-topology-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Guard regression tests using explicitly synthetic netlists
        run: |
          set -euo pipefail
          cd research/2026-10-28-independent-wpt-sensor-v01/w_ind_22
          python3 -m unittest -v test_w_ind_22_netlist_guard
      - name: Export actual W-IND-21 netlist using native KiCad 9.0.2
        shell: bash
        run: |
          set -euo pipefail
          IMAGE=kicad/kicad:9.0.2
          DIR=research/2026-10-28-independent-wpt-sensor-v01/w_ind_21
          OUT=research/2026-10-28-independent-wpt-sensor-v01/w_ind_22/native_out
          mkdir -p "$OUT"
          docker pull "$IMAGE"
          docker run --rm "$IMAGE" kicad-cli version
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp -e XDG_CACHE_HOME=/tmp/cache \
            -e XDG_CONFIG_HOME=/tmp/config -e XDG_DATA_HOME=/tmp/data \
            -v "$GITHUB_WORKSPACE:/repo" -w "/repo/$DIR" "$IMAGE" \
            sh -ec '
              mkdir -p /tmp/config/kicad/9.0
              sed "s#\${KIPRJMOD}#/repo/research/2026-10-28-independent-wpt-sensor-v01/w_ind_21#g" sym-lib-table > /tmp/config/kicad/9.0/sym-lib-table
              test -s /tmp/config/kicad/9.0/sym-lib-table
              kicad-cli sch export netlist --format kicadxml \
                -o /repo/research/2026-10-28-independent-wpt-sensor-v01/w_ind_22/native_out/w21.native.xml \
                W_IND_21_TX_BENCH_DECLARED.kicad_sch
            '
          test -s "$OUT/w21.native.xml"
      - name: Enforce independently reviewed two-cut net topology
        shell: bash
        run: |
          set -euo pipefail
          DIR=research/2026-10-28-independent-wpt-sensor-v01/w_ind_22
          python3 "$DIR/w_ind_22_netlist_guard.py" \
            "$DIR/native_out/w21.native.xml" \
            --report "$DIR/native_out/attestation.json"
          echo "::notice::Topology matches W-IND-21 review only. NO FOD/thermal/current/anti-reverse or safety approval."
      - name: Archive native XML and report even on mismatch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w-ind-22-native-netlist
          path: research/2026-10-28-independent-wpt-sensor-v01/w_ind_22/native_out/
          if-no-files-found: warn
          retention-days: 30
