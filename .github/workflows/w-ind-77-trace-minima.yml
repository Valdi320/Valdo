name: W-IND-77 TX energy integration and RX minima synthetic gate
on:
  push:
    paths:
      - 'research/2026-10-28-independent-wpt-sensor-v01/w_ind_77/**'
      - '.github/workflows/w-ind-77-trace-minima.yml'
  pull_request:
    paths:
      - 'research/2026-10-28-independent-wpt-sensor-v01/w_ind_77/**'
      - '.github/workflows/w-ind-77-trace-minima.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trace-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: W77 synthetic adversarial tests and evidence regeneration
        working-directory: research/2026-10-28-independent-wpt-sensor-v01/w_ind_77
        run: |
          python3 -m unittest -v test_w77.py
          python3 w77_trace_gate.py --input TRACE_SYNTHETIC.json --output W77_REGENERATED.json
          cmp W77_EVIDENCE_SYNTHETIC.json W77_REGENERATED.json
      - name: Archive strictly synthetic evidence
        uses: actions/upload-artifact@v4
        with:
          name: w77-synthetic-integrated-energy-rx-minima
          path: research/2026-10-28-independent-wpt-sensor-v01/w_ind_77/W77_REGENERATED.json
